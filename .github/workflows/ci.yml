name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnguard
          POSTGRES_PASSWORD: learnguard
          POSTGRES_DB: learnguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnguard -d learnguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://learnguard:learnguard@localhost:5432/learnguard?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OPENAI_MODEL: gpt-5-mini
      LTI_MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: learnguard-ai:ci
